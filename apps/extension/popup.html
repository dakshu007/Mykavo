<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>MyKavo SEO Checker</title>
</head>
<body>
  <header class="head">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="5" width="18" height="22" rx="3" fill="#FFD400" stroke="#151515" stroke-width="2"/>
        <g stroke="#151515" stroke-width="2" stroke-linecap="round">
          <line x1="22" y1="9" x2="28" y2="6"/>
          <line x1="23" y1="14" x2="29" y2="13"/>
          <line x1="23" y1="19" x2="29" y2="20"/>
          <line x1="22" y1="24" x2="28" y2="27"/>
        </g>
      </svg>
      <span>MyKavo</span>
    </div>
    <span class="tag">SEO Checker</span>
  </header>

  <div id="url" class="url">Checking this page…</div>

  <div id="score-band" class="score-band" hidden>
    <div class="ring-wrap">
      <svg viewBox="0 0 72 72" class="ring">
        <circle cx="36" cy="36" r="30" fill="none" stroke="#EDEBDD" stroke-width="8"/>
        <circle id="ring-fill" cx="36" cy="36" r="30" fill="none" stroke="#1f9d55" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="0 189" transform="rotate(-90 36 36)"/>
      </svg>
      <span id="score" class="score">–</span>
    </div>
    <div class="score-meta">
      <p id="verdict" class="verdict">…</p>
      <p id="counts" class="counts"></p>
    </div>
  </div>

  <div id="error" class="error" hidden></div>

  <ul id="checks" class="checks"></ul>

  <footer class="foot">
    <a id="cta-audit" class="btn btn-gold" target="_blank" rel="noopener"
      href="https://mykavo.app/dashboard/site-audit?utm_source=extension">
      Run a full site audit →
    </a>
    <a class="btn btn-ghost" target="_blank" rel="noopener"
      href="https://mykavo.app/?utm_source=extension">
      Monitor this site with MyKavo
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
