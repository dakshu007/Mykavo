# Builds and deploys the MyKavo web app (apps/web) to the Netlify project
# "mykavo" (https://mykavo.app).
#
# WHY THIS EXISTS
# ---------------
# The Netlify project was never connected to this repository - every deploy
# used to be a manual CLI upload from the owner's Mac (the Aug 2026 live
# deploy carried commit_ref: null, branch: null, deploy_source: "cli").
# Production and `main` drifted apart as a result: a full week of work
# (Site Audit, Search Console, MyKavo Analyser, client reports) shipped to
# production while `main` sat five weeks behind, and a deploy made by another
# tool had to be rolled back by hand with no commit to trace it to.
#
# `main` was fast-forwarded to the production build on 2026-09-08, and this
# workflow now deploys every push to it. Git is the source of truth: if it is
# not on `main`, it is not in production.
#
# Deploy by pushing to `main`. Do NOT deploy by hand from a laptop - a manual
# CLI upload is exactly what caused the drift, and nothing here can detect it.
#
# THE GATE
# --------
# Two jobs. `test` runs every check a contributor runs locally - lint, web and
# worker typecheck, and every package's tests including the @mykavo/database
# integration suite against a throwaway Postgres with all migrations applied.
# `deploy` declares `needs: test`, so GitHub never starts it unless every
# check passed: a red test means nothing reaches production. Pull requests
# into main run `test` only, so a change shows red before it is merged.
#
# The scan worker deploys itself: its server runs infra/worker/update.sh every
# few minutes. It follows the `worker-release` branch, which `release-worker`
# moves to a commit only after `test` passes. So the worker is gated the same
# way: a red test never reaches it.
#
# REQUIRED REPOSITORY SECRETS
#   NETLIFY_AUTH_TOKEN  Netlify personal access token (User settings ->
#                       Applications -> Personal access tokens). Needs deploy
#                       rights on the "mykavo" project.
#   NETLIFY_SITE_ID     3c4a3c88-f933-4430-9455-e2d693941f67
#
# Build-time environment variables (DATABASE_URL, BETTER_AUTH_SECRET, the four
# R2_* vars, the Dodo keys, ...) are NOT stored here. The Netlify CLI pulls
# them from the linked project during `netlify deploy --build`, which is the
# same way the manual Mac deploy gets them. Secrets never enter this repo.

name: deploy-web

on:
  # Normal path: every push to main that touches the deployed app.
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "netlify.toml"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
      # The worker is gated here too (job release-worker below).
      - "apps/worker/**"
      - "infra/worker/**"

  # Checks only, never a deploy: shows a PR red before it can be merged.
  # No paths filter, so worker-only changes are checked too.
  pull_request:
    branches: [main]

  # Escape hatch: redeploy an arbitrary ref by hand (e.g. to re-publish after
  # an infrastructure blip). Requires typing "deploy" to confirm. The tests
  # still run first.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a PRODUCTION deploy of this ref'
        required: true
        default: ""

permissions:
  contents: read

# Never let two production deploys race. Unlike the APK build this does NOT
# cancel in progress - killing a half-finished deploy is worse than queueing.
# Pull requests get their own group and a newer push cancels the older check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-web-pr-{0}', github.ref) || 'deploy-web-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway database for the @mykavo/database integration suite (and
    # anything else that reads DATABASE_URL). Nothing here can reach
    # production: the URL points at this container and holds no secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mykavo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mykavo_test
    steps:
      - name: Check confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'deploy'
        run: |
          echo "::error::Confirmation failed - type 'deploy' to run a production deploy."
          exit 1

      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json "packageManager".
      # Before setup-node so its pnpm cache works.
      - uses: pnpm/action-setup@v4

      # Node 20 matches netlify.toml's build.environment NODE_VERSION.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @mykavo/database exec prisma generate

      # Every migration, in order, on an empty database: also proves the
      # migrations themselves apply cleanly before they are run on Supabase.
      - name: Apply migrations to the test database
        run: pnpm --filter @mykavo/database exec prisma migrate deploy

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck web
        run: pnpm --filter web typecheck

      # The worker runs scans and alerts; it has no tests of its own (its
      # logic lives in the packages below), so its typecheck is its gate.
      - name: Typecheck worker
        run: pnpm --filter worker typecheck

      # Every package's tests, the database integration suite included.
      - name: Tests
        run: pnpm -r --if-present test

      # A production build. Typecheck and tests cannot catch a server-only
      # module (node:dns, node:crypto) pulled into a client component; only
      # the bundler can. Placeholder values only: nothing here is a secret
      # and the build never reaches production from this job.
      - name: Production build
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-secret-000000
          BETTER_AUTH_URL: http://localhost:3000
          APP_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter web build

  # Points worker-release at this commit now that every check passed; the
  # worker server picks it up within five minutes (infra/worker/update.sh).
  # A normal (non-force) push: runs are serialised by the concurrency group,
  # so it only ever moves forward.
  release-worker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move worker-release to the tested commit
        run: git push origin "HEAD:refs/heads/worker-release"

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client must exist before the build - the same step
      # netlify.toml runs in its build command.
      - name: Generate Prisma client
        run: pnpm --filter @mykavo/database exec prisma generate

      # `--filter web` is REQUIRED: it lets Netlify manage base/publish for the
      # monorepo. netlify.toml must not set base/publish itself, or the publish
      # directory resolves to the repo root and every route 404s.
      #
      # This checkout is standalone (not nested inside another repository), so
      # Next's file tracing bundles the correct Prisma query engine - the
      # failure mode the manual runbook avoids with an rsync to /tmp.
      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets are required."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy \
            --build \
            --prod \
            --filter web \
            --site "$NETLIFY_SITE_ID" \
            --message "GitHub Actions: ${GITHUB_SHA}"

      # /blog is prerendered at build time without database access (Netlify
      # keeps DATABASE_URL out of the build), so the deployed copy has no
      # posts. It regenerates on the first request after 30 seconds: make that
      # request here, so no visitor is the one who sees the placeholder.
      # Never fails the deploy - the page also heals on its own.
      - name: Regenerate the blog index
        continue-on-error: true
        run: |
          sleep 35
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 30 "https://mykavo.app/blog" || true)
            if [ -n "$body" ] && ! grep -q "The latest guides are loading" <<<"$body"; then
              echo "Blog index is live with posts."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::/blog still shows the build-time placeholder; it will regenerate on the next visit."
